<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lớp B2 — Học tiếng Anh trình độ B2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF1F6; --card:#FFFFFF; --ink:#16233B; --muted:#5B6B85; --line:#D8DEE9;
  --hi:#FFE566; --hi-soft:#FFF0A8; --red:#C2413A; --green:#1E7A5B; --blue:#2A4FD8;
  --sans:"Be Vietnam Pro", system-ui, "Segoe UI", sans-serif;
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  --shadow:0 1px 0 var(--line);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1622; --card:#17202E; --ink:#E7ECF4; --muted:#93A1B8; --line:#27313F;
    --hi:rgba(255,229,102,.32); --hi-soft:rgba(255,229,102,.16);
    --red:#F0897F; --green:#5FD0A6; --blue:#93ABFF;
    --shadow:0 1px 0 var(--line);
  }
}
:root[data-theme="dark"]{
  --paper:#0E1622; --card:#17202E; --ink:#E7ECF4; --muted:#93A1B8; --line:#27313F;
  --hi:rgba(255,229,102,.32); --hi-soft:rgba(255,229,102,.16);
  --red:#F0897F; --green:#5FD0A6; --blue:#93ABFF;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:16px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
:where(a){color:inherit}
:focus-visible{outline:2.5px solid var(--blue); outline-offset:2px; border-radius:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important; transition:none!important}}

/* ---------- shell ---------- */
.shell{display:grid; grid-template-columns:232px minmax(0,1fr); min-height:100vh}
.rail{
  border-right:1px solid var(--line); padding:20px 14px 40px;
  position:sticky; top:0; height:100vh; overflow:auto; background:var(--card);
}
.brand{display:flex; gap:10px; align-items:baseline; padding:0 8px 18px}
.brand b{font-weight:800; font-size:20px; letter-spacing:-.02em}
.brand span{font-size:12px; color:var(--muted)}
.navbtn{
  display:flex; gap:10px; align-items:center; width:100%; text-align:left;
  background:none; border:0; border-radius:7px; padding:9px 10px; margin-bottom:2px;
  font:inherit; font-weight:600; font-size:14.5px; color:var(--ink); cursor:pointer;
}
.navbtn:hover{background:var(--paper)}
.navbtn[aria-current="page"]{background:var(--hi-soft)}
.navbtn[aria-current="page"] .ico{transform:none}
.ico{width:22px; text-align:center; font-size:15px}
.railfoot{margin-top:22px; padding:12px 10px 0; border-top:1px solid var(--line); font-size:12.5px; color:var(--muted)}
main{padding:34px 30px 90px; max-width:860px}
.tabbar{display:none}

@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .rail{position:static; height:auto; border-right:0; border-bottom:1px solid var(--line); padding:14px}
  .rail .navlist, .railfoot{display:none}
  main{padding:20px 16px 96px}
  .tabbar{
    display:grid; grid-template-columns:repeat(8,1fr); position:fixed; bottom:0; left:0; right:0;
    background:var(--card); border-top:1px solid var(--line); z-index:20;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .tabbar button{background:none;border:0;font:inherit;color:var(--muted);padding:8px 1px 10px;font-size:9.5px;font-weight:600;cursor:pointer;display:grid;gap:3px;justify-items:center}
  .tabbar button[aria-current="page"]{color:var(--ink)}
  .tabbar button i{font-style:normal;font-size:16px}
}

/* ---------- type ---------- */
h1{font-size:31px; line-height:1.15; letter-spacing:-.025em; font-weight:800; margin:0 0 6px}
h2{font-size:21px; letter-spacing:-.015em; font-weight:800; margin:34px 0 10px}
h3{font-size:16px; font-weight:800; margin:20px 0 6px}
.lede{color:var(--muted); margin:0 0 26px; max-width:60ch}
.en{font-family:var(--serif)}
.ipa{font-family:var(--serif); font-style:italic; color:var(--muted)}
.hl{background-image:linear-gradient(transparent 58%, var(--hi) 58%, var(--hi) 94%, transparent 94%)}
.pen{color:var(--red)}
.ok{color:var(--green)}
small,.small{font-size:13px; color:var(--muted)}

/* ---------- bits ---------- */
.card{background:var(--card); border:1px solid var(--line); border-radius:11px; padding:18px}
.stack>*+*{margin-top:12px}
.row{display:flex; gap:9px; flex-wrap:wrap; align-items:center}
.spread{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap}
button.btn{
  font:inherit; font-weight:600; font-size:14.5px; cursor:pointer;
  border-radius:6px; padding:9px 15px; border:1px solid var(--ink);
  background:var(--ink); color:var(--card);
}
button.btn.ghost{background:transparent; color:var(--ink); border-color:var(--line)}
button.btn.ghost:hover{border-color:var(--ink)}
button.btn:disabled{opacity:.45; cursor:not-allowed}
button.btn.sm{padding:6px 11px; font-size:13px; border-radius:5px}
.chip{
  display:inline-flex; gap:6px; align-items:center; border:1px solid var(--line);
  border-radius:3px; padding:3px 9px; font-size:12.5px; font-weight:600; background:var(--card);
}
.chip.on{background:var(--hi-soft); border-color:transparent}
.chip.btn{cursor:pointer; font-family:inherit}
.bar{height:7px; background:var(--paper); border:1px solid var(--line); border-radius:99px; overflow:hidden}
.bar i{display:block; height:100%; background:var(--ink)}
.grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(215px,1fr)); gap:12px}
.stat{border:1px solid var(--line); border-radius:9px; padding:13px 14px; background:var(--card)}
.stat b{display:block; font-size:26px; letter-spacing:-.02em; line-height:1.1}
.stat span{font-size:12.5px; color:var(--muted)}
input[type=text],textarea,select{
  font:inherit; color:var(--ink); background:var(--card);
  border:1px solid var(--line); border-radius:6px; padding:9px 11px; width:100%;
}
textarea{resize:vertical}
.speak{
  border:1px solid var(--line); background:var(--card); color:var(--ink);
  border-radius:50%; width:34px; height:34px; cursor:pointer; font-size:15px; line-height:1;
}
.speak:hover{border-color:var(--ink)}

/* ---------- home hero ---------- */
.hero{padding:6px 0 4px}
.wotd{font-family:var(--serif); font-size:46px; line-height:1.05; font-weight:600; letter-spacing:-.02em; display:inline-block; padding:0 4px}
.wotd-wrap{position:relative; display:inline-block; margin:10px 0 6px}
.wotd-wrap::before{
  content:""; position:absolute; inset:16% -8px 8% -8px; background:var(--hi);
  transform:rotate(-1.2deg); border-radius:2px; z-index:0;
}
.wotd-wrap .wotd{position:relative; z-index:1}

/* ---------- flashcard ---------- */
.flash{min-height:250px; display:grid; place-items:center; text-align:center; padding:28px 20px}
.flash .word{font-family:var(--serif); font-size:38px; font-weight:600; letter-spacing:-.02em; line-height:1.15}
.flash .vi{font-size:20px; font-weight:600; margin-top:12px}
.flash .ex{font-family:var(--serif); font-size:16.5px; margin-top:14px; max-width:46ch}

/* ---------- lists ---------- */
.tlist{border:1px solid var(--line); border-radius:11px; overflow:hidden; background:var(--card)}
.titem{display:block; width:100%; text-align:left; background:none; border:0; border-bottom:1px solid var(--line); padding:14px 16px; font:inherit; cursor:pointer; color:inherit}
.titem:last-child{border-bottom:0}
.titem:hover{background:var(--hi-soft)}
.titem b{display:block; font-weight:600; font-size:15.5px}
.titem span{font-size:13px; color:var(--muted)}

/* ---------- content blocks ---------- */
.note{border-left:3px solid var(--hi); background:var(--hi-soft); padding:10px 14px; border-radius:0 7px 7px 0}
.exbox{border:1px solid var(--line); border-radius:9px; padding:14px; background:var(--card)}
.exbox+.exbox{margin-top:10px}
.nitem{border:1px solid var(--line); border-radius:9px; padding:12px 14px; background:var(--card); margin-bottom:9px}
.nitem.new{border-left:3px solid var(--hi)}
.tools{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:8px; margin-bottom:12px}
.empty{border:1px dashed var(--line); border-radius:9px; padding:26px 18px; text-align:center; color:var(--muted)}
details>summary{cursor:pointer; font-weight:600; font-size:14.5px}
.q{font-weight:600; margin-bottom:9px}
.opt{display:block; width:100%; text-align:left; font:inherit; background:var(--card); color:inherit;
  border:1px solid var(--line); border-radius:7px; padding:10px 13px; margin-bottom:7px; cursor:pointer}
.opt:hover{border-color:var(--ink)}
.opt.right{border-color:var(--green); background:color-mix(in srgb, var(--green) 10%, transparent)}
.opt.wrong{border-color:var(--red); background:color-mix(in srgb, var(--red) 10%, transparent)}
.fb{margin-top:9px; font-size:14px}
.passage{font-family:var(--serif); font-size:17.5px; line-height:1.72; max-width:66ch}
.passage p{margin:0 0 15px}
table.gtab{border-collapse:collapse; width:100%; font-size:14.5px; margin:10px 0}
table.gtab td,table.gtab th{border:1px solid var(--line); padding:8px 10px; text-align:left; vertical-align:top}
table.gtab th{background:var(--paper); font-weight:600}
.ruled{
  font-family:var(--serif); font-size:17px; line-height:30px; min-height:330px;
  background-image:repeating-linear-gradient(var(--card) 0 29px, var(--line) 29px 30px);
  background-attachment:local; padding:6px 12px; border-radius:7px;
}
.diffw{padding:0 1px; border-radius:2px}
.diffw.bad{color:var(--red); text-decoration:underline wavy var(--red); text-underline-offset:3px}
.diffw.miss{color:var(--red); background:color-mix(in srgb, var(--red) 12%, transparent)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<div class="shell">
  <aside class="rail">
    <div class="brand"><b>Lớp B2</b><span>tiếng Anh, mỗi ngày một ít</span></div>
    <div class="navlist" id="navlist"></div>
    <div class="railfoot">
      <div id="railStreak"></div>
      <button class="btn ghost sm" id="themeBtn" style="margin-top:10px">Đổi nền sáng/tối</button>
      <button class="btn ghost sm" id="resetBtn" style="margin-top:6px">Xoá tiến độ</button>
    </div>
  </aside>
  <main id="view" tabindex="-1"></main>
</div>
<nav class="tabbar" id="tabbar" aria-label="Điều hướng"></nav>

{id:"perfect", t:"Present Perfect vs Past Simple vs Present Perfect Continuous",
 sub:"Chọn đúng thì khi nói về quá khứ có liên hệ hiện tại",
 html:`<p><b>Past Simple</b> — hành động đã kết thúc, gắn với <i>thời điểm quá khứ xác định</i>: <span class="en">I <span class="hl">saw</span> her yesterday.</span></p>
 <p><b>Present Perfect</b> — quá khứ <i>không xác định thời điểm</i>, nhưng có <i>kết quả/liên hệ ở hiện tại</i>: <span class="en">I <span class="hl">have lost</span> my keys.</span> (⇒ bây giờ vẫn chưa tìm thấy)</p>
 <p><b>Present Perfect Continuous</b> — nhấn mạnh <i>quá trình kéo dài</i> tới hiện tại, hoặc kết quả nhìn thấy được của quá trình đó: <span class="en">I <span class="hl">have been waiting</span> for an hour.</span></p>
 <table class="gtab"><tr><th>Dấu hiệu</th><th>Thì dùng</th></tr>
 <tr><td>yesterday, last week, in 2019, ago, when I was…</td><td>Past Simple</td></tr>
 <tr><td>ever, never, just, already, yet, so far, recently, this week</td><td>Present Perfect</td></tr>
 <tr><td>for, since + nhấn mạnh sự kéo dài / How long…?</td><td>Present Perfect Continuous</td></tr></table>
 <p class="note">Động từ trạng thái (<span class="en">know, be, believe, own, understand</span>) thường <b>không</b> dùng ở dạng tiếp diễn: <span class="en">I <span class="hl">have known</span> him for years.</span> (không dùng <span class="pen">have been knowing</span>)</p>`,
 ex:[
 {q:"I ____ (not / see) Mai since we left school.", a:["haven't seen","have not seen"]},
 {q:"She's exhausted — she ____ (work) in the garden all morning.", a:["has been working","'s been working"]},
 {q:"We ____ (move) to Da Nang in 2019 and we love it here.", a:["moved"]},
 {q:"How long ____ you ____ (learn) English? — About six years.", a:["have been learning","have you been learning"], hint:"Điền đủ: have … been learning"}]},

{id:"pastperf", t:"Past Perfect & Past Perfect Continuous",
 sub:"Quá khứ của quá khứ",
 html:`<p><b>Past Perfect</b> (<span class="en">had + V3</span>) diễn tả hành động xảy ra <i>trước</i> một mốc quá khứ khác:</p>
 <p class="en">When we arrived, the film <span class="hl">had already started</span>.</p>
 <p><b>Past Perfect Continuous</b> (<span class="en">had been + V-ing</span>) nhấn mạnh quá trình kéo dài trước mốc đó:</p>
 <p class="en">She <span class="hl">had been driving</span> for six hours before she stopped for a rest.</p>
 <p>Nếu hai hành động xảy ra <i>theo trình tự rõ ràng</i> với <span class="en">after / before / then</span>, ta thường dùng Past Simple cho cả hai: <span class="en">He finished the report and then went home.</span></p>
 <p class="note">Bẫy thường gặp: sau <span class="en">by the time</span> + quá khứ, mệnh đề chính hầu như luôn dùng Past Perfect. <span class="en">By the time the guests arrived, she <b>had cooked</b> everything.</span></p>`,
 ex:[
 {q:"By the time I got to the station, the train ____ (leave).", a:["had left"]},
 {q:"They were tired because they ____ (travel) all night.", a:["had been travelling","had been traveling"]},
 {q:"I didn't recognise her — I ____ (never / meet) her before.", a:["had never met"]},
 {q:"After he ____ (check) the figures, he sent the email.", a:["had checked","checked"]}]},

{id:"cond", t:"Câu điều kiện loại 2, loại 3 và hỗn hợp",
 sub:"Giả định trái thực tế ở hiện tại và quá khứ",
 html:`<table class="gtab">
 <tr><th>Loại</th><th>Cấu trúc</th><th>Ví dụ</th></tr>
 <tr><td>2 — trái thực tế ở hiện tại</td><td>If + V2/V-ed, would + V</td><td class="en">If I had more time, I would read more.</td></tr>
 <tr><td>3 — trái thực tế ở quá khứ</td><td>If + had + V3, would have + V3</td><td class="en">If she had studied, she would have passed.</td></tr>
 <tr><td>Hỗn hợp: quá khứ → hiện tại</td><td>If + had + V3, would + V</td><td class="en">If I had taken that job, I would be in Ha Noi now.</td></tr>
 <tr><td>Hỗn hợp: hiện tại → quá khứ</td><td>If + V2/V-ed, would have + V3</td><td class="en">If he weren't so shy, he would have spoken up.</td></tr></table>
 <p>Ở loại 2, dùng <span class="en">were</span> cho mọi ngôi trong văn viết trang trọng: <span class="en">If I <span class="hl">were</span> you, I'd apologise.</span></p>
 <p>Thay <span class="en">would</span> bằng <span class="en">might / could</span> khi muốn giảm mức chắc chắn: <span class="en">If we left now, we <b>might</b> catch the 7:15.</span></p>
 <p class="note">Đảo ngữ trang trọng (bỏ <span class="en">if</span>): <span class="en"><b>Had</b> I known about the delay, I would have called you.</span></p>`,
 ex:[
 {q:"If I ____ (be) you, I'd take the earlier flight.", a:["were","was"]},
 {q:"If they had booked sooner, they ____ (get) a cheaper room.", a:["would have got","would have gotten"]},
 {q:"If she hadn't missed the interview, she ____ (work) here now.", a:["would be working","would work"]},
 {q:"____ we known the risk, we would never have signed. (đảo ngữ)", a:["had"]}]},

{id:"wish", t:"Wish / If only / would rather",
 sub:"Diễn đạt tiếc nuối và mong muốn",
 html:`<table class="gtab">
 <tr><th>Muốn nói gì</th><th>Cấu trúc</th><th>Ví dụ</th></tr>
 <tr><td>Tiếc về hiện tại</td><td>wish + V2/V-ed</td><td class="en">I wish I spoke Japanese.</td></tr>
 <tr><td>Tiếc về quá khứ</td><td>wish + had + V3</td><td class="en">I wish I had applied earlier.</td></tr>
 <tr><td>Phàn nàn, muốn người khác đổi</td><td>wish + would + V</td><td class="en">I wish you would stop interrupting.</td></tr>
 <tr><td>Muốn ai làm gì</td><td>would rather + S + V2/V-ed</td><td class="en">I'd rather you didn't tell her.</td></tr>
 <tr><td>Muốn tự mình làm gì</td><td>would rather + V (nguyên mẫu)</td><td class="en">I'd rather stay in tonight.</td></tr></table>
 <p><span class="en">If only</span> dùng giống <span class="en">wish</span> nhưng nhấn mạnh hơn: <span class="en">If only I <b>had listened</b> to you!</span></p>
 <p class="note">Không dùng <span class="en">wish … would</span> cho chính mình: <span class="pen">I wish I would be taller.</span> → <span class="en ok">I wish I were taller.</span></p>`,
 ex:[
 {q:"I wish I ____ (not / say) that to him yesterday.", a:["hadn't said","had not said"]},
 {q:"If only it ____ (stop) raining — we can't go out.", a:["would stop"]},
 {q:"I'd rather you ____ (not / smoke) in here.", a:["didn't smoke","did not smoke"]},
 {q:"She wishes she ____ (have) more free time at the weekend.", a:["had"]}]},

{id:"passive", t:"Bị động nâng cao & thể sai khiến",
 sub:"Passive reporting, have/get something done",
 html:`<p><b>Bị động với động từ tường thuật</b> — dùng khi nguồn tin không xác định hoặc muốn giữ khách quan:</p>
 <p class="en">It <span class="hl">is believed that</span> the factory will close. = The factory <span class="hl">is believed to close</span>.</p>
 <p class="en">He <span class="hl">is thought to have left</span> the country. (hành động xảy ra trước ⇒ to have + V3)</p>
 <p>Các động từ thường gặp: <span class="en">say, think, believe, report, know, expect, allege, consider</span>.</p>
 <p><b>Causative</b> — ai đó làm hộ ta:</p>
 <table class="gtab">
 <tr><td class="en">have something done</td><td>trang trọng, trung tính</td><td class="en">I had my laptop repaired.</td></tr>
 <tr><td class="en">get something done</td><td>thân mật hơn</td><td class="en">We got the walls painted.</td></tr>
 <tr><td class="en">have somebody do</td><td>sai khiến trực tiếp</td><td class="en">She had her assistant book the tickets.</td></tr>
 <tr><td class="en">get somebody to do</td><td>thuyết phục ai làm</td><td class="en">I got my brother to help me.</td></tr></table>
 <p class="note">Dùng <span class="en">have something done</span> cả khi gặp chuyện không may: <span class="en">He <b>had</b> his phone <b>stolen</b> on the bus.</span></p>`,
 ex:[
 {q:"People say that he is very wealthy. → He ____ to be very wealthy.", a:["is said"]},
 {q:"They believe the thief escaped through the window. → The thief ____ to have escaped through the window.", a:["is believed"]},
 {q:"I'm going to ____ (have / my hair / cut) tomorrow.", a:["have my hair cut"]},
 {q:"We ____ (get) the report translated last week.", a:["got"]}]},

{id:"reported", t:"Câu tường thuật (Reported speech)",
 sub:"Lùi thì, đổi đại từ, động từ tường thuật",
 html:`<p>Khi động từ tường thuật ở quá khứ, thì trong câu thường <b>lùi một bậc</b>:</p>
 <table class="gtab"><tr><th>Trực tiếp</th><th>Tường thuật</th></tr>
 <tr><td class="en">"I <b>am</b> tired."</td><td class="en">He said he <b>was</b> tired.</td></tr>
 <tr><td class="en">"I <b>saw</b> it."</td><td class="en">She said she <b>had seen</b> it.</td></tr>
 <tr><td class="en">"I <b>will</b> call."</td><td class="en">He said he <b>would</b> call.</td></tr>
 <tr><td class="en">"I <b>can</b> swim."</td><td class="en">She said she <b>could</b> swim.</td></tr></table>
 <p>Đổi trạng từ: <span class="en">now → then, today → that day, tomorrow → the next day, yesterday → the day before, here → there, this → that</span>.</p>
 <p><b>Động từ tường thuật ở B2</b> — biết dùng các động từ này quan trọng hơn là lùi thì:</p>
 <table class="gtab">
 <tr><td class="en">offer / promise / refuse / agree + to V</td><td class="en">He offered to drive me home.</td></tr>
 <tr><td class="en">advise / remind / warn + sb + to V</td><td class="en">She warned me not to touch it.</td></tr>
 <tr><td class="en">admit / deny / suggest + V-ing</td><td class="en">He denied taking the money.</td></tr>
 <tr><td class="en">insist / suggest + (that) + S + V</td><td class="en">She insisted that he apologise.</td></tr>
 <tr><td class="en">apologise for / accuse sb of + V-ing</td><td class="en">They accused him of cheating.</td></tr></table>
 <p class="note">Không lùi thì nếu điều được nói vẫn đúng ở hiện tại: <span class="en">She told me the office <b>opens</b> at eight.</span></p>`,
 ex:[
 {q:'"I\'ll send it tomorrow," he said. → He said he ____ send it the next day.', a:["would"]},
 {q:'"Don\'t leave the door open," she told me. → She told me ____ leave the door open.', a:["not to"]},
 {q:'"It was me who broke it," he said. → He ____ (admit) breaking it.', a:["admitted"]},
 {q:'"Why don\'t we meet on Friday?" → She ____ (suggest) meeting on Friday.', a:["suggested"]}]},

{id:"relative", t:"Mệnh đề quan hệ & rút gọn",
 sub:"Defining, non-defining, participle clauses",
 html:`<p><b>Xác định (defining)</b> — thông tin thiết yếu, <i>không</i> có dấu phẩy. Có thể bỏ đại từ quan hệ khi nó là tân ngữ:</p>
 <p class="en">The book (that) I borrowed <span class="hl">was</span> excellent.</p>
 <p><b>Không xác định (non-defining)</b> — thông tin bổ sung, <i>có</i> dấu phẩy, <b>không</b> dùng <span class="en">that</span> và không được lược bỏ:</p>
 <p class="en">My neighbour, <span class="hl">who works nights</span>, sleeps all morning.</p>
 <p><b>Giới từ + which/whom</b> (văn viết trang trọng): <span class="en">the issue <b>to which</b> she referred</span> = <span class="en">the issue she referred to</span>.</p>
 <p><b>which</b> thay cho cả mệnh đề trước đó: <span class="en">He arrived late, <b>which</b> annoyed everyone.</span></p>
 <p><b>Rút gọn thành phân từ:</b></p>
 <table class="gtab">
 <tr><td class="en">the man who is standing there</td><td>→</td><td class="en">the man standing there</td></tr>
 <tr><td class="en">the letters which were sent yesterday</td><td>→</td><td class="en">the letters sent yesterday</td></tr>
 <tr><td class="en">the first person who arrived</td><td>→</td><td class="en">the first person to arrive</td></tr></table>`,
 ex:[
 {q:"That's the café ____ we first met. (nơi chốn)", a:["where"]},
 {q:"My sister, ____ lives in Hue, is a nurse.", a:["who"]},
 {q:"The train was cancelled, ____ meant we had to wait two hours.", a:["which"]},
 {q:"The candidates ____ (select) for interview will be contacted. (rút gọn bị động)", a:["selected"]}]},

{id:"modals", t:"Modal verbs of deduction",
 sub:"Suy đoán về hiện tại và quá khứ",
 html:`<table class="gtab"><tr><th>Mức độ</th><th>Hiện tại</th><th>Quá khứ</th></tr>
 <tr><td>Chắc chắn đúng</td><td class="en">must be</td><td class="en">must have been</td></tr>
 <tr><td>Có thể</td><td class="en">may / might / could be</td><td class="en">may / might / could have been</td></tr>
 <tr><td>Chắc chắn không</td><td class="en">can't be</td><td class="en">can't / couldn't have been</td></tr></table>
 <p class="en">The lights are off — they <span class="hl">must have gone</span> out.</p>
 <p class="en">She <span class="hl">can't have finished</span> already; she only started an hour ago.</p>
 <p><b>Phân biệt với nghĩa khác của modal:</b></p>
 <table class="gtab">
 <tr><td class="en">should have + V3</td><td>đáng lẽ nên (nhưng đã không)</td><td class="en">You should have told me.</td></tr>
 <tr><td class="en">needn't have + V3</td><td>đã làm nhưng hoá ra không cần</td><td class="en">You needn't have cooked — we ate on the way.</td></tr>
 <tr><td class="en">didn't need to + V</td><td>không cần nên đã không làm</td><td class="en">I didn't need to buy milk.</td></tr></table>
 <p class="note">Dùng <span class="en">can't have</span>, không dùng <span class="pen">mustn't have</span>, để phủ định suy đoán.</p>`,
 ex:[
 {q:"He's not answering. He ____ (be) asleep. (suy đoán chắc chắn)", a:["must be"]},
 {q:"She ____ (not / see) us — she walked straight past. (chắc chắn không)", a:["can't have seen","couldn't have seen","cannot have seen"]},
 {q:"You ____ (tell) me it was formal! I wore jeans. (đáng lẽ nên)", a:["should have told"]},
 {q:"We ____ (not / hurry); the film started half an hour late. (đã vội mà hoá ra không cần)", a:["needn't have hurried","need not have hurried"]}]},

{id:"ing_inf", t:"Gerund hay Infinitive?",
 sub:"V-ing, to V và những cặp đổi nghĩa",
 html:`<table class="gtab">
 <tr><th>Theo sau là V-ing</th><th>Theo sau là to V</th></tr>
 <tr><td class="en">avoid, enjoy, mind, suggest, deny, admit, risk, consider, practise, can't stand, look forward to, be used to</td><td class="en">decide, hope, offer, refuse, promise, manage, afford, agree, seem, pretend, tend</td></tr></table>
 <p><b>Cặp đổi nghĩa — hay ra trong đề thi B2:</b></p>
 <table class="gtab">
 <tr><td class="en">stop <b>smoking</b></td><td>bỏ hút thuốc</td><td class="en">stop <b>to smoke</b></td><td>dừng lại để hút</td></tr>
 <tr><td class="en">remember <b>locking</b></td><td>nhớ là đã khoá</td><td class="en">remember <b>to lock</b></td><td>nhớ phải khoá</td></tr>
 <tr><td class="en">try <b>calling</b></td><td>thử gọi xem sao</td><td class="en">try <b>to call</b></td><td>cố gắng gọi</td></tr>
 <tr><td class="en">regret <b>telling</b></td><td>hối hận vì đã nói</td><td class="en">regret <b>to tell</b></td><td>rất tiếc phải báo</td></tr>
 <tr><td class="en">mean <b>waiting</b></td><td>đồng nghĩa với việc phải chờ</td><td class="en">mean <b>to wait</b></td><td>có ý định chờ</td></tr></table>
 <p class="note">Sau giới từ luôn là V-ing: <span class="en">She's good <b>at solving</b> problems.</span> — kể cả <span class="en">to</span> trong <span class="en">look forward to</span>, <span class="en">be used to</span>, <span class="en">object to</span>.</p>`,
 ex:[
 {q:"I look forward to ____ (hear) from you.", a:["hearing"]},
 {q:"He stopped ____ (buy) a coffee on the way to work.", a:["to buy"]},
 {q:"Remember ____ (turn) off the lights when you leave.", a:["to turn"]},
 {q:"They can't afford ____ (move) to a bigger flat.", a:["to move"]}]},

{id:"linking", t:"Liên từ & từ nối cho bài viết B2",
 sub:"Tương phản, nguyên nhân, kết quả, nhượng bộ",
 html:`<table class="gtab"><tr><th>Ý</th><th>+ mệnh đề (S + V)</th><th>+ danh từ / V-ing</th><th>Trạng từ nối câu</th></tr>
 <tr><td>Tương phản</td><td class="en">although, though, even though, while, whereas</td><td class="en">despite, in spite of</td><td class="en">however, nevertheless, on the other hand</td></tr>
 <tr><td>Nguyên nhân</td><td class="en">because, since, as</td><td class="en">because of, due to, owing to</td><td class="en">—</td></tr>
 <tr><td>Kết quả</td><td class="en">so, so … that</td><td class="en">—</td><td class="en">therefore, consequently, as a result</td></tr>
 <tr><td>Mục đích</td><td class="en">so that, in order that</td><td class="en">to, in order to, so as to</td><td class="en">—</td></tr></table>
 <p class="en ok">Although the weather was bad, we enjoyed the trip.</p>
 <p class="en ok">Despite the bad weather, we enjoyed the trip.</p>
 <p class="en pen">Despite the weather was bad, we enjoyed the trip. ✗</p>
 <p class="note">Mẹo nhớ: <span class="en">despite / in spite of</span> theo sau là <b>danh từ</b>. Muốn dùng với mệnh đề, thêm <span class="en">the fact that</span>: <span class="en">despite <b>the fact that</b> the weather was bad</span>.</p>`,
 ex:[
 {q:"____ the high price, the tickets sold out in an hour. (+ danh từ)", a:["despite","in spite of"]},
 {q:"The road was closed, ____ we had to take a detour.", a:["so"]},
 {q:"She took the job ____ the long commute. (+ danh từ)", a:["despite","in spite of"]},
 {q:"____ he had trained hard, he didn't win. (+ mệnh đề)", a:["although","though","even though"]}]},

{id:"inversion", t:"Đảo ngữ & nhấn mạnh",
 sub:"Hardly, no sooner, not only, cleft sentences",
 html:`<p>Khi đưa trạng từ phủ định lên đầu câu, phải <b>đảo trợ động từ lên trước chủ ngữ</b>:</p>
 <table class="gtab">
 <tr><td class="en">Never have I seen such a mess.</td><td>Chưa bao giờ tôi thấy lộn xộn như vậy.</td></tr>
 <tr><td class="en">Hardly had we sat down when the phone rang.</td><td>Vừa mới ngồi xuống thì chuông điện thoại reo.</td></tr>
 <tr><td class="en">No sooner had he left than it started to rain.</td><td>Anh ấy vừa đi thì trời bắt đầu mưa.</td></tr>
 <tr><td class="en">Not only did she apologise, but she also paid for the damage.</td><td>Không những xin lỗi, cô ấy còn đền thiệt hại.</td></tr>
 <tr><td class="en">Only after the meeting did I understand the problem.</td><td>Chỉ sau cuộc họp tôi mới hiểu vấn đề.</td></tr></table>
 <p>Chú ý cặp cố định: <span class="en">hardly … <b>when</b></span> nhưng <span class="en">no sooner … <b>than</b></span>.</p>
 <p><b>Câu chẻ (cleft)</b> để nhấn mạnh một thành phần:</p>
 <p class="en">It was <span class="hl">Mai</span> who suggested the idea. / What I need is <span class="hl">a week off</span>.</p>`,
 ex:[
 {q:"Never ____ I heard such a ridiculous excuse. (điền trợ động từ)", a:["have"]},
 {q:"No sooner had she arrived ____ the meeting began.", a:["than"]},
 {q:"Not only ____ he forget my name, he also forgot the date.", a:["did"]},
 {q:"____ was Lan who booked the tickets, not me. (câu chẻ)", a:["it"]}]}
];

{id:"r1", t:"The Four-Day Week Goes Mainstream", sub:"Xã hội & lao động · ~300 từ",
 body:`<p>For most of the last century, the five-day working week was treated as a fact of life rather than a choice. That assumption is now being tested. Since 2022, hundreds of companies across Europe, Asia and North America have run trials in which staff work four days a week for the same pay, on the condition that they maintain their previous level of output.</p>
 <p>The results have been more encouraging than many employers expected. In the largest coordinated trial, carried out in the United Kingdom, the vast majority of participating firms chose to keep the shorter week once the trial had finished. Managers reported that staff turnover fell sharply and that fewer employees took sick leave. Workers, for their part, said they slept better and found it easier to manage responsibilities at home.</p>
 <p>Critics argue that these findings should be treated with caution. Firms that volunteer for such trials are likely to be unusually well organised in the first place, and the sectors involved have tended to be office-based. It is far from obvious how a four-day week could be introduced in a hospital, a factory or a school without hiring additional staff, which would raise costs considerably.</p>
 <p>Supporters accept the point but insist the principle still holds. They argue that much of the traditional working week is consumed by meetings that achieve little and by tasks that exist mainly to demonstrate effort. Removing a day, they claim, forces organisations to distinguish between work that creates value and work that merely fills time.</p>
 <p>Whether the four-day week becomes standard will probably depend less on ideology than on competition for talent. If skilled workers begin to expect it, employers may find that the question has already been decided for them.</p>`,

{id:"r2", t:"Why Cities Are Planting Trees", sub:"Môi trường đô thị · ~290 từ",
 body:`<p>When a city council announces that it intends to plant a hundred thousand trees, most residents assume the aim is to make the streets look greener. Increasingly, though, the main motive is temperature.</p>
 <p>Dense urban areas can be several degrees warmer than the countryside surrounding them, a phenomenon known as the urban heat island effect. Concrete, asphalt and brick absorb heat during the day and release it slowly after dark, so that cities cool down far more slowly than open land. During a heatwave, this difference is not merely uncomfortable; it is dangerous, particularly for elderly people and for anyone whose home has no air conditioning.</p>
 <p>Trees reduce the problem in two ways. The most obvious is shade: a mature tree can prevent a large amount of sunlight from ever reaching the pavement beneath it. The second mechanism is less visible. As water evaporates from their leaves, trees draw heat from the surrounding air, in much the same way that sweating cools the human body. Measurements taken in several European cities suggest that a well-shaded street can be noticeably cooler than an identical street without trees a few hundred metres away.</p>
 <p>The difficulty lies in maintenance. Young trees planted along busy roads are exposed to pollution, road salt and compacted soil, and a substantial proportion die within their first few years unless they are watered regularly. Planting is cheap and highly visible; watering is expensive and attracts no attention whatsoever.</p>
 <p>For this reason, researchers who study urban forests tend to judge a city not by the number of trees it plants but by the number still alive a decade later. By that measure, the record of most cities is considerably less impressive than their press releases suggest.</p>`,

{id:"r3", t:"How Habits Are Built", sub:"Tâm lý học · ~280 từ",
 body:`<p>Anyone who has tried to take up running in January and abandoned it by February knows that motivation is unreliable. Psychologists who study habit formation argue that this is precisely the point: habits exist so that behaviour does not have to depend on motivation at all.</p>
 <p>A habit, in technical terms, is a learned association between a situation and a response. The situation — researchers usually call it a cue — might be a time of day, a place, an emotional state or the end of another routine. Once the association is strong enough, the cue triggers the behaviour with little conscious deliberation. This is why people often find themselves halfway through a packet of biscuits without remembering the decision to open it.</p>
 <p>The practical implication is that the cue deserves more attention than the goal. Someone who resolves to "read more" has set an outcome; someone who decides to read ten pages immediately after brushing their teeth at night has attached a specific behaviour to a stable, daily cue. Studies consistently find that plans of the second kind are far more likely to survive.</p>
 <p>How long the process takes is frequently misreported. The often-quoted figure of twenty-one days has little evidence behind it. One widely cited study found that the average was closer to two months, but the range among participants was enormous, stretching from under three weeks to the best part of a year, depending on the person and the complexity of the behaviour.</p>
 <p>Perhaps the most useful finding is the least dramatic. Missing a single day, the researchers concluded, had no measurable effect on the eventual strength of the habit. What mattered was returning the following day.</p>`,
 gloss:[["cue","tín hiệu kích hoạt hành vi"],["deliberation","sự cân nhắc có ý thức"],["resolve to","quyết tâm làm gì"],["widely cited","được trích dẫn rộng rãi"],["the best part of a year","gần trọn một năm"]],

  {q:"According to the writer, why do habits matter?",o:["They increase motivation.","They make behaviour independent of motivation.","They are easy to form.","They replace goals entirely."],c:1,e:"Đoạn 1: thói quen tồn tại để hành vi không phải phụ thuộc vào động lực."},
  {q:"The biscuit example illustrates that:",o:["people eat too much sugar","habits run with little conscious thought","cues are always visual","habits are hard to break"],c:1,e:"Đoạn 2: tín hiệu kích hoạt hành vi mà gần như không cần cân nhắc có ý thức."},
  {q:"Which plan is more likely to succeed?",o:["\"I'll read more this year.\"","\"I'll read ten pages after brushing my teeth.\"","\"I'll buy more books.\"","\"I'll read when I feel motivated.\""],c:1,e:"Đoạn 3: hành vi cụ thể gắn với một tín hiệu ổn định hằng ngày."},
  {q:"What does the writer say about the 21-day figure?",o:["It is well supported.","It applies only to exercise.","It lacks solid evidence.","It was never published."],c:2,e:"Đoạn 4: con số 21 ngày gần như không có bằng chứng."},
  {q:"What was the researchers' most useful conclusion?",o:["Missing one day does no lasting harm.","Habits take exactly two months.","Complex habits never form.","Motivation is essential."],c:0,e:"Đoạn cuối: bỏ lỡ một ngày không ảnh hưởng đo được; quan trọng là quay lại vào hôm sau."}]}

const KEY = "b2vn.v1";
const DEF = {known:{}, xp:0, quizBest:0, quizRuns:0, grammarDone:{}, readDone:{}, dictDone:{}, essays:{}, notes:[], streak:0, last:null, theme:null};
let S = Object.assign({}, DEF);

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw) S = Object.assign({}, DEF, JSON.parse(raw));
    if(!Array.isArray(S.notes)) S.notes = [];
  }catch(e){ /* bộ nhớ trình duyệt không dùng được: chạy tạm trong phiên này */ }
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
}
function today(){ return new Date().toISOString().slice(0,10); }
function touchStreak(){
  const t = today();
  if(S.last === t) return;
  const y = new Date(Date.now()-86400000).toISOString().slice(0,10);
  S.streak = (S.last === y) ? (S.streak||0)+1 : 1;
  S.last = t; save();
}
function addXp(n){ S.xp = (S.xp||0)+n; touchStreak(); save(); paintRail(); }

const TAGS = {core:"Từ học thuật", phrasal:"Cụm động từ", colloc:"Collocation", mine:"Tự thêm", sentence:"Mẫu câu"};
function hasNote(w){ return (S.notes||[]).some(n => norm(n.w) === norm(w)); }
function addNote(o){
  if(!o.w || !String(o.w).trim()) return false;
  if(hasNote(o.w)) return false;
  S.notes.unshift(Object.assign({
    id: "n" + Date.now().toString(36) + Math.random().toString(36).slice(2,6),
    added: today(), tag: "mine", ipa:"", p:"", vi:"", ex:"", exvi:"", note:""
  }, o));
  save(); return true;
}
function delNote(id){ S.notes = (S.notes||[]).filter(n => n.id !== id); save(); }

const $ = (s,r)=> (r||document).querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function norm(s){
  return String(s).toLowerCase().replace(/[’']/g,"'").replace(/[.,!?;:"“”]/g,"").replace(/\s+/g," ").trim();
}
function shuffle(a){ const b=a.slice(); for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]];} return b; }

let voice = null;
function pickVoice(){
  if(!("speechSynthesis" in window)) return;
  const vs = speechSynthesis.getVoices().filter(v=>/^en(-|_)/i.test(v.lang));
  voice = vs.find(v=>/GB|UK/i.test(v.lang)) || vs[0] || null;
}
if("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text, rate){
  if(!("speechSynthesis" in window)) return false;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-GB"; u.rate = rate || 0.95;
  if(voice) u.voice = voice;
  speechSynthesis.speak(u);
  return true;
}
function speakBtn(text, label){
  return '<button class="speak" data-say="'+esc(text)+'" title="Nghe" aria-label="Nghe '+esc(label||"phát âm")+'">♪</button>';
}
document.addEventListener("click", e=>{
  const b = e.target.closest("[data-say]");
  if(b){ if(!say(b.getAttribute("data-say"))) b.textContent="✕"; }
});

/* =========================================================
   MÀN HÌNH: TỪ VỰNG
   ========================================================= */
let vDeck = "core", vQueue = [], vPos = 0, vFlipped = false;
const DECKS = {core:"Từ học thuật", phrasal:"Cụm động từ", colloc:"Collocation"};
function buildQueue(onlyUnknown){
  let list = VOCAB.filter(v=>v.d===vDeck);
  if(onlyUnknown) list = list.filter(v=>!S.known[v.w]);
  if(!list.length) list = VOCAB.filter(v=>v.d===vDeck);
  vQueue = shuffle(list); vPos = 0; vFlipped = false;
}
VIEWS.vocab = function(){
  if(!vQueue.length) buildQueue(true);
  $("#view").innerHTML = `
  <h1>Từ vựng</h1>
  <p class="lede">Nhìn từ, tự nhớ nghĩa rồi mới lật thẻ. Đánh dấu “Chưa thuộc” để từ đó quay lại trong lượt sau.</p>
  <div class="row" style="margin-bottom:14px" id="deckRow">
    ${Object.keys(DECKS).map(k=>'<button class="chip btn '+(vDeck===k?'on':'')+'" data-deck="'+k+'">'+DECKS[k]+' · '+VOCAB.filter(v=>v.d===k).length+'</button>').join("")}
  </div>
  <div id="flashHost"></div>
  <h2>Danh sách ${DECKS[vDeck].toLowerCase()}</h2>
  <div class="tlist" id="vlist"></div>`;
  paintFlash(); paintVList();
};
function paintFlash(){
  const host = $("#flashHost"); if(!host) return;
  if(vPos >= vQueue.length){
    host.innerHTML = `<div class="card flash"><div>
      <div style="font-size:19px;font-weight:700">Xong bộ thẻ này rồi.</div>
      <p class="small">Bạn đã đi hết ${vQueue.length} thẻ trong lượt vừa rồi.</p>
      <div class="row" style="justify-content:center">
        <button class="btn" id="againNew">Ôn lại các từ chưa thuộc</button>
        <button class="btn ghost" id="againAll">Ôn lại toàn bộ</button>
      </div></div></div>`;
    $("#againNew").onclick = ()=>{ buildQueue(true); paintFlash(); };
    $("#againAll").onclick = ()=>{ buildQueue(false); paintFlash(); };
    return;
  }
  const v = vQueue[vPos];
  host.innerHTML = `
  <div class="card flash">
    <div>
      <div class="word en">${esc(v.w)}</div>
      <div class="row" style="justify-content:center;margin-top:8px">
        <span class="ipa">${esc(v.ipa)}</span><span class="chip">${esc(v.p)}</span>${speakBtn(v.w, v.w)}
      </div>
      ${vFlipped ? `<div class="vi">${esc(v.vi)}</div>
        <p class="ex en">${esc(v.ex)}</p>
        <p class="small" style="margin:4px 0 0">${esc(v.exvi)}</p>` : `<p class="small" style="margin-top:18px">Nhớ nghĩa trong đầu trước khi lật.</p>`}
    </div>
  </div>
  <div class="spread" style="margin-top:12px">
    <span class="small">Thẻ ${vPos+1}/${vQueue.length}</span>
    <div class="row">
      ${vFlipped
        ? `<button class="btn ghost" id="fNo">Chưa thuộc</button><button class="btn" id="fYes">Đã thuộc</button>`
        : `<button class="btn" id="fFlip">Xem nghĩa</button>`}
    </div>
  </div>`;
  if(vFlipped){
    $("#fNo").onclick = ()=>{ delete S.known[v.w]; save(); vPos++; vFlipped=false; paintFlash(); paintVList(); paintRail(); };
    $("#fYes").onclick = ()=>{
      if(!S.known[v.w]){ S.known[v.w]=1; addXp(2); }
      addNote({w:v.w, ipa:v.ipa, p:v.p, vi:v.vi, ex:v.ex, exvi:v.exvi, tag:v.d});
      save(); vPos++; vFlipped=false; paintFlash(); paintVList(); paintRail();
    };
  }else{
    $("#fFlip").onclick = ()=>{ vFlipped=true; paintFlash(); };
  }
}
function paintVList(){
  const el = $("#vlist"); if(!el) return;
  el.innerHTML = VOCAB.filter(v=>v.d===vDeck).map(v=>
    `<div class="titem" style="cursor:default">
      <div class="spread">
        <div><b class="en">${esc(v.w)} <span class="ipa" style="font-weight:400">${esc(v.ipa)}</span></b>
        <span>${esc(v.vi)}</span></div>
        <div class="row">${hasNote(v.w)?'<span class="chip on">đã lưu</span>':'<button class="chip btn" data-savew="'+esc(v.w)+'">+ sổ tay</button>'}${speakBtn(v.w, v.w)}</div>
      </div>
    </div>`).join("");
}

/* =========================================================
   MÀN HÌNH: SỔ TAY
   ========================================================= */
let nFilter = "all", nQuery = "", nSort = "new", nEdit = null;
let rvQueue = null, rvPos = 0, rvFlip = false;

function noteList(){
  let list = (S.notes||[]).slice();
  if(nFilter !== "all") list = list.filter(n => (n.tag||"mine") === nFilter);
  const q = norm(nQuery);
  if(q) list = list.filter(n => norm([n.w,n.vi,n.ex,n.note].join(" ")).indexOf(q) >= 0);
  if(nSort === "az") list.sort((a,b) => String(a.w).toLowerCase().localeCompare(String(b.w).toLowerCase()));
  return list;
}

VIEWS.notes = function(){

      .map(f => '<button class="chip btn '+(nFilter===f[0]?'on':'')+'" data-nf="'+f[0]+'">'+f[1]+(f[0]==="all"?" · "+all.length:(counts[f[0]]?" · "+counts[f[0]]:""))+'</button>').join("")}

    <div class="row" style="margin-top:8px">

  const addOne = ()=>{

    const ok = addNote({w:w, vi:$("#aVi").value.trim(), ex:$("#aEx").value.trim(), note:$("#aNote").value.trim(), tag:$("#aTag").value});

    addXp(1);

function copyText(text, msgId){
  const done = ok => { const m = $("#"+msgId); if(m) m.innerHTML = ok ? '<span class="ok">Đã sao chép.</span>' : '<span class="pen">Trình duyệt chặn sao chép — hãy bôi đen rồi copy thủ công.</span>'; };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>done(true), ()=>done(false));
  }else done(false);
}

function paintNotes(){
  const host = $("#nList"); if(!host) return;
  const list = noteList();
  if(!list.length){
    host.innerHTML = '<div class="empty">'+((S.notes||[]).length
      ? 'Không có mục nào khớp với bộ lọc này.'
      : 'Sổ tay đang trống. Đánh dấu “Đã thuộc” ở phần Từ vựng, hoặc tự thêm một mục ở trên.')+'</div>';
    return;
  }
  host.innerHTML = list.map(n => nEdit === n.id ? noteEditHtml(n) : noteHtml(n)).join("");
  host.querySelectorAll("[data-del]").forEach(b => b.onclick = ()=>{
    if(confirm('Xoá “'+b.getAttribute("data-del-w")+'” khỏi sổ tay?')){ delNote(b.getAttribute("data-del")); VIEWS.notes(); }
  });
  host.querySelectorAll("[data-edit]").forEach(b => b.onclick = ()=>{ nEdit = b.getAttribute("data-edit"); paintNotes(); });
  host.querySelectorAll("[data-cancel]").forEach(b => b.onclick = ()=>{ nEdit = null; paintNotes(); });
  host.querySelectorAll("[data-savee]").forEach(b => b.onclick = ()=>{
    const id = b.getAttribute("data-savee");
    const n = (S.notes||[]).find(x => x.id === id); if(!n) return;
    const box = b.closest(".nitem");
    n.w = box.querySelector('[data-f="w"]').value.trim() || n.w;
    n.vi = box.querySelector('[data-f="vi"]').value.trim();
    n.ex = box.querySelector('[data-f="ex"]').value.trim();
    n.note = box.querySelector('[data-f="note"]').value.trim();
    save(); nEdit = null; paintNotes();
  });
}

function noteEditHtml(n){

function paintRev(){
  const box = $("#revBox"); if(!box) return;
  if(!rvQueue){ box.innerHTML = ""; return; }
  if(rvPos >= rvQueue.length){
    box.innerHTML = `<div class="card flash"><div>
      <div style="font-size:18px;font-weight:700">Hết lượt ôn.</div>
      <p class="small">Bạn vừa đi qua ${rvQueue.length} mục trong sổ tay.</p>
      <div class="row" style="justify-content:center">
        <button class="btn" id="rvAgain">Ôn lại lượt nữa</button>
        <button class="btn ghost" id="rvClose">Đóng</button>
      </div></div></div>`;
    $("#rvAgain").onclick = ()=>{ rvQueue = shuffle(rvQueue); rvPos = 0; rvFlip = false; paintRev(); };
    $("#rvClose").onclick = ()=>{ rvQueue = null; paintRev(); };
    return;
  }
  const n = rvQueue[rvPos];
  box.innerHTML = `<div class="card flash" style="min-height:190px"><div>
      <div class="word en" style="font-size:31px">${esc(n.w)}</div>
      <div class="row" style="justify-content:center;margin-top:8px">${speakBtn(n.w, n.w)}</div>
      ${rvFlip ? `<div class="vi">${esc(n.vi||"(chưa ghi nghĩa)")}</div>
        ${n.ex?'<p class="ex en">'+esc(n.ex)+'</p>':''}
        ${n.note?'<p class="small" style="margin:6px 0 0">✎ '+esc(n.note)+'</p>':''}` : ''}
    </div></div>
    <div class="spread" style="margin-top:10px">
      <span class="small">Ôn ${rvPos+1}/${rvQueue.length}</span>
      <div class="row">
        <button class="btn ghost sm" id="rvStop">Dừng</button>
        ${rvFlip ? '<button class="btn sm" id="rvNext">Mục tiếp theo</button>' : '<button class="btn sm" id="rvFlip">Xem nghĩa</button>'}
      </div>
    </div>`;
  $("#rvStop").onclick = ()=>{ rvQueue = null; paintRev(); };
  if(rvFlip) $("#rvNext").onclick = ()=>{ rvPos++; rvFlip = false; paintRev(); };
  else $("#rvFlip").onclick = ()=>{ rvFlip = true; paintRev(); };
}

      const val = norm(inp.value);
      const good = x.a.some(a=>norm(a)===val);
      if(good){ right++; fb.innerHTML = '<span class="ok">✓ Chính xác.</span>'; }
      else if(reveal){ fb.innerHTML = '<span class="pen">Đáp án: '+x.a.map(esc).join(" / ")+'</span>'+(x.hint?' <span class="small">'+esc(x.hint)+'</span>':''); }
      else { fb.innerHTML = '<span class="pen">✕ Chưa đúng — thử lại.</span>'+(x.hint?' <span class="small">'+esc(x.hint)+'</span>':''); }
    });
    if(right === g.ex.length && !S.grammarDone[g.id]){ S.grammarDone[g.id]=1; addXp(10); }
    return right;
  };
  $("#gCheck").onclick = ()=>check(false);
  $("#gShow").onclick = ()=>check(true);
}

/* =========================================================
   MÀN HÌNH: LUYỆN TẬP (TRẮC NGHIỆM)
   ========================================================= */
let qSet = [], qPos = 0, qScore = 0, qLocked = false;
VIEWS.quiz = function(){
  qSet = shuffle(QUIZ).slice(0,10); qPos = 0; qScore = 0; qLocked = false;
  $("#view").innerHTML = `
  <h1>Luyện tập</h1>
  <p class="lede">Mười câu lấy ngẫu nhiên từ ngân hàng ${QUIZ.length} câu ngữ pháp và từ vựng. Sai câu nào có giải thích ngay câu đó.</p>
  <div class="bar" style="margin-bottom:16px"><i id="qBar" style="width:0%"></i></div>
  <div id="qHost"></div>`;
  paintQ();
};
function paintQ(){
  const host = $("#qHost");
  $("#qBar").style.width = (qPos/10*100)+"%";
  if(qPos >= qSet.length){
    if(qScore > (S.quizBest||0)) S.quizBest = qScore;
    S.quizRuns = (S.quizRuns||0)+1; addXp(qScore*3);
    const msg = qScore>=9 ? "Rất chắc. Thử chuyển sang phần đọc hiểu."
      : qScore>=7 ? "Ổn định ở mức B2. Ôn lại các câu vừa sai."
      : qScore>=5 ? "Nền tảng có rồi, còn thiếu độ chính xác. Quay lại phần ngữ pháp."
      : "Nên ôn kỹ phần ngữ pháp trước khi làm lại.";
    host.innerHTML = `<div class="card stack">
      <div style="font-size:40px;font-weight:800;letter-spacing:-.03em">${qScore}<span style="font-size:20px;color:var(--muted)">/10</span></div>
      <p>${msg}</p>
      <div class="row"><button class="btn" id="qAgain">Làm bộ 10 câu khác</button>
      <button class="btn ghost" data-go="grammar">Ôn ngữ pháp</button></div></div>`;
    $("#qAgain").onclick = ()=>VIEWS.quiz();
    paintRail(); return;
  }
  const it = qSet[qPos];
  host.innerHTML = `
  <div class="card">
    <div class="small">Câu ${qPos+1} / 10</div>
    <div class="q en" style="font-size:18px;margin:6px 0 12px">${esc(it.q)}</div>
    ${it.o.map((o,k)=>'<button class="opt en" data-k="'+k+'">'+esc(o)+'</button>').join("")}
    <div class="fb" id="qFb"></div>
  </div>
  <div class="row" style="margin-top:12px"><button class="btn" id="qNext" disabled>Câu tiếp theo</button></div>`;
  qLocked = false;
  host.querySelectorAll(".opt").forEach(btn=>{
    btn.onclick = ()=>{
      if(qLocked) return; qLocked = true;
      const k = +btn.getAttribute("data-k");
      host.querySelectorAll(".opt").forEach((b,j)=>{ if(j===it.c) b.classList.add("right"); });
      if(k===it.c){ qScore++; $("#qFb").innerHTML = '<span class="ok">✓ Đúng.</span> '+esc(it.e); }
      else { btn.classList.add("wrong"); $("#qFb").innerHTML = '<span class="pen">✕ Chưa đúng.</span> '+esc(it.e); }
      $("#qNext").disabled = false;
    };
  });
  $("#qNext").onclick = ()=>{ qPos++; paintQ(); };
}

let dPos = 0, dRate = 0.85;
VIEWS.listen = function(){
  const supported = "speechSynthesis" in window;
  $("#view").innerHTML = `
  <h1>Nghe & chép chính tả</h1>
  <p class="lede">Nghe câu, gõ lại chính xác từng từ. Những chỗ sai sẽ được gạch chân đỏ để bạn thấy mình nghe hụt ở đâu.</p>
  ${supported ? "" : '<div class="note" style="margin-bottom:14px">Trình duyệt này không đọc được tiếng Anh. Bạn vẫn có thể đọc câu gốc ở nút “Xem câu gốc”.</div>'}
  <div class="row" style="margin-bottom:14px">
    <span class="small">Tốc độ đọc</span>
    ${[["0.7","chậm"],["0.85","vừa"],["1","tự nhiên"]].map(r=>'<button class="chip btn '+(String(dRate)===r[0]?'on':'')+'" data-rate="'+r[0]+'">'+r[1]+'</button>').join("")}
  </div>
  <div id="dHost"></div>`;
  paintD();
};
function diffWords(target, typed){
  const T = norm(target).split(" "), U = norm(typed).split(" ").filter(Boolean);
  const n=T.length, m=U.length, dp=[];
  for(let a=0;a<=n;a++){ dp.push(new Array(m+1).fill(0)); }
  for(let a=n-1;a>=0;a--) for(let b=m-1;b>=0;b--)
    dp[a][b] = T[a]===U[b] ? dp[a+1][b+1]+1 : Math.max(dp[a+1][b], dp[a][b+1]);
  const match = new Array(n).fill(false);
  let a=0,b=0;
  while(a<n && b<m){
    if(T[a]===U[b]){ match[a]=true; a++; b++; }
    else if(dp[a+1][b] >= dp[a][b+1]) a++;
    else b++;
  }
  const words = target.split(/\s+/);
  let hit = 0;
  const html = words.map((w,k)=>{
    const good = match[k];
    if(good) hit++;
    return '<span class="diffw'+(good?'':' bad')+'">'+esc(w)+'</span>';
  }).join(" ");
  return {html, hit, total:n};
}
function paintD(){
  const host = $("#dHost");
  const s = DICTATION[dPos];
  host.innerHTML = `
  <div class="card stack">
    <div class="spread">
      <span class="small">Câu ${dPos+1} / ${DICTATION.length}</span>
      <div class="row">
        <button class="btn sm" id="dPlay">▶ Nghe</button>
        <button class="btn ghost sm" id="dShow">Xem câu gốc</button>
      </div>
    </div>
    <textarea id="dIn" rows="3" placeholder="Gõ lại câu bạn nghe được…" spellcheck="false"></textarea>
    <div class="row">
      <button class="btn" id="dCheck">Kiểm tra</button>
      <button class="btn ghost" id="dNext">Câu tiếp theo</button>
    </div>
    <div id="dFb"></div>
  </div>`;
  const play = ()=>{ if(!say(s, dRate)) $("#dFb").innerHTML='<span class="pen">Trình duyệt không hỗ trợ đọc tiếng Anh.</span>'; };
  $("#dPlay").onclick = play;
  $("#dShow").onclick = ()=>{ $("#dFb").innerHTML = '<p class="en" style="font-size:17px">'+esc(s)+'</p>'; };
  $("#dCheck").onclick = ()=>{
    const r = diffWords(s, $("#dIn").value);
    const perfect = r.hit === r.total;
    if(perfect && !S.dictDone[dPos]){ S.dictDone[dPos]=1; addXp(5); }
    $("#dFb").innerHTML = '<div class="small" style="margin-bottom:4px">Đúng '+r.hit+'/'+r.total+' từ</div>'+
      '<p class="en" style="font-size:17.5px;margin:0">'+r.html+'</p>'+
      (perfect ? '<p class="ok" style="margin:6px 0 0">Chính xác từng từ.</p>' : '<p class="small" style="margin:6px 0 0">Những từ gạch đỏ là chỗ bạn nghe hụt hoặc gõ khác. Nghe lại chậm rồi thử lần nữa.</p>');
    paintRail();
  };
  $("#dNext").onclick = ()=>{ dPos = (dPos+1)%DICTATION.length; paintD(); };
  setTimeout(play, 350);
}
